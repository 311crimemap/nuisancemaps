name: 311crimemap Test Runner

on:
 push:
   branches: [ master ]
 workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      pg1:
        image: bitnami/postgresql:13.5.0
        env:
          POSTGRESQL_USERNAME: postgres
          POSTGRESQL_PASSWORD: admin
          POSTGRESQL_DATABASE: nuisancemaps_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    steps:
      - name: Check out code
        uses: actions/checkout@v4

      #
      # `github.workspace` variable isn't available to service containers (pg1)
      # typically would be a volume mount and run on container init script
      # but here we just manually mount and run on load
      #
      - name: initdb create extensions
        run: |
          docker run --rm \
          --network host \
          -e PGPASSWORD=admin \
          -v ${{ github.workspace }}/db/01_enable_postgis.sql:/docker-entrypoint-initdb.d/01_enable_postgis.sql \
          bitnami/postgresql:13.5.0 \
          psql -U postgres -d nuisancemaps_test -h localhost -f /docker-entrypoint-initdb.d/01_enable_postgis.sql

      #
      # Run Liquibase migration using a container (liquibase/liquibase:4.25)
      #
      - name: Run Liquibase migration
        run: |
          docker run --rm \
          --network host \
          -v ${{ github.workspace }}/api/src/main/resources/liquibase-test.properties:/liquibase/liquibase.properties \
          -v ${{ github.workspace }}/api/src/main/resources/db/changelog-master.yml:/liquibase/db/changelog-master.yml \
          -v ${{ github.workspace }}/api/src/main/resources/db/changelogs:/liquibase/db/changelogs \
          liquibase/liquibase:4.25 \
          liquibase update \
          --url=jdbc:postgresql://localhost:5432/nuisancemaps_test \
          --username=postgres \
          --password=admin

      - name: Set up Maven cache directory
        run: mkdir -p $HOME/.m2

        #
        # Cache Maven dependencies
        #
      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: $HOME/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run Tests
        run: |
          docker run --rm \
          --network host \
          -e POSTGRESQL_TEST_USER=postgres \
          -e POSTGRESQL_TEST_PASSWORD=admin \
          -e POSTGRESQL_TEST_URL=jdbc:postgresql://localhost:5432/nuisancemaps_test \
          -e CORS_ORIGINS=*,http://localhost:5173,http://localhost:4173,http://192.168.0.1:5173 \
          -e WORKER_QUERY_LIMIT=50000 \
          -e BATCH_SIZE=25000 \
          -e ADMIN_API_KEY=1234 \
          -e VITE_MAX_DATA_RECORDS=20000 \
          -e FETCH_DATA_DIR=/data \
          -e DATA_DIR_MIN_FREE=2000000 \
          -e ASYNC_EXECUTOR_CORE_POOL_SIZE=1 \
          -e ASYNC_EXECUTOR_MAX_POOL_SIZE=1 \
          -e ASYNC_EXECUTOR_QUEUE_CAPACITY=1 \
          -e MAPTILER_HOST_REFERER=localhost \
          -e VITE_MAPTILER_API_KEY=abc123 \
          -e GEOAPIFY_API_KEY=abc123 \
          -v ${{ github.workspace }}/api:/api \
          -v $HOME/.m2:/root/.m2 \
          -v ${{ github.workspace }}/data:/data \
          -w /api \
          eclipse-temurin:17-jdk \
          bash -c "./mvnw test -P test -Dspring.profiles.active=test"
