# STAGING
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-cluster-issuer
spec:
  acme:
    # The ACME server URL - note this is now a "production" request for a cert
    # for our staging environment
    # server: https://acme-staging-v02.api.letsencrypt.org/directory
    server: https://acme-v02.api.letsencrypt.org/directory
    # Email address used for ACME registration
    email: ${CERT_MANAGER_EMAIL}
    # Name of a secret used to store the ACME account private key
    privateKeySecretRef:
      name: letsencrypt-cluster-issuer-secret
    # Enable the DNS-01 challenge provider
    # w/ fallback HTTP-01 challenge provider
    solvers:
      - dns01:
          cloudflare:
            email: ${CERT_MANAGER_EMAIL}
            apiTokenSecretRef:
              name: cloudflare-api-token-secrets
              key: api-token
        selector:
          dnsNames:
            - 'staging-api.311crimemap.com'
            - 'staging-grafana.311crimemap.com'
      - http01:
          ingress:
            class: traefik
