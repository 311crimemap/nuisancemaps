#
# kubectl getcronjobs
#
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pgbackrest-db-backup-cron-full
  namespace: core-db
  annotations:
    description: Pod run on control node to run kubectl commands
spec:
  schedule: "0 22 * * 5"  # run every Fri at 10 PM. [s, h, day of m, m, Day]
  # Do not start another scheduled backup while the previous Job is active.
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          hostNetwork: true
          nodeSelector:
            node.kubernetes.io/class_id: gen

          # Need to enable hostPath access
          securityContext:
            runAsUser: 0

          containers:
          - name: k3s-kubectl
            image: bitnamilegacy/kubectl:latest
            command: ["bin/bash", "-c"]
            args:
              - |
                set -e
                # 0. Do not disturb an existing backup (or its log).
                if kubectl exec -n core-db core-db-postgresql-ha-postgresql-0 -- \
                bash -c "ps -ef | grep '[p]gbackrest' | grep -E '[[:space:]]backup([[:space:]]|$)' | grep -v defunct" > /dev/null; then
                echo "ERROR: A pgBackRest backup is already running; refusing to overlap it."
                exit 1
                fi

                # Clear old logs so we don't read a stale success message.
                echo "Cleaning up old logs..."
                kubectl exec -n core-db core-db-postgresql-ha-postgresql-0 -- rm -f /tmp/backup.log

                # 1. Start the backup and record the exact process to monitor.
                echo "Launching pgbackrest on database pod..."
                BACKUP_PID="$(kubectl exec -n core-db core-db-postgresql-ha-postgresql-0 -- \
                bash -c "nohup env PGPASSWORD='$PGPASSWORD' pgbackrest \
                --stanza='$PGBACKREST_STANZA' \
                --pg1-database=postgres \
                --log-level-console=detail \
                --repo=2 \
                --archive-timeout=1d \
                --type=full backup > /tmp/backup.log 2>&1 & echo \$!")"
                case "$BACKUP_PID" in
                ''|*[!0-9]*)
                echo "ERROR: Could not determine the pgBackRest process ID: $BACKUP_PID"
                exit 1
                ;;
                esac
                echo "Launched pgBackRest backup PID: $BACKUP_PID"

                # 2. Poll the backup we launched using fresh, short-lived connections.
                echo "Entering monitor loop (resilient to Hetzner idle timeouts)..."
                while true; do
                PROCESS_STATE="$(kubectl exec -n core-db core-db-postgresql-ha-postgresql-0 -- \
                ps -o stat= -p "$BACKUP_PID" 2>/dev/null || true)"
                case "$PROCESS_STATE" in
                ''|Z*)
                echo "Launched backup process finished."
                break
                ;;
                esac

                # Print a heartbeat to the Job logs
                TIMESTAMP=$(date '+%H:%M:%S')
                LOG_LINE=$(kubectl exec -n core-db core-db-postgresql-ha-postgresql-0 -- tail -n 1 /tmp/backup.log)
                echo "[$TIMESTAMP] Status: $LOG_LINE"

                # Wait 30 seconds - well below the 8-minute Hetzner drop
                sleep 30
                done

                # 3. Final Verification
                echo "Backup process ended. Verifying results..."
                if kubectl exec -n core-db core-db-postgresql-ha-postgresql-0 -- grep -q "completed successfully" /tmp/backup.log; then
                echo "SUCCESS: Full backup verified."
                else
                echo "ERROR: Backup failed. Last 20 lines of log:"
                kubectl exec -n core-db core-db-postgresql-ha-postgresql-0 -- tail -n 20 /tmp/backup.log
                exit 1
                fi

            envFrom:
              - configMapRef:
                  name: pgbackrest-configmap

            env:
              - name: KUBECONFIG
                value: /config/.kube/config

              - name: PGPASSWORD
                valueFrom:
                  secretKeyRef:
                    name: pgbackrest-secrets
                    key: PGPASSWORD

            volumeMounts:
              - name: kube-config-file
                mountPath: /config/.kube/config

          volumes:
            - name: pgbackrest-configmap-volume
              configMap:
                name: pgbackrest-configmap

            - name: kube-config-file
              hostPath:
                path: /root/.kube/config
                type: File

          restartPolicy: OnFailure
