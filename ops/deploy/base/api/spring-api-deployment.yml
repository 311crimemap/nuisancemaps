apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: spring-api
  name: spring-api
  namespace: crimemap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-api
  strategy: {}
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: spring-api
    spec:
      affinity:
        nodeAffinity:
          # Hard requirement: Avoid `node.kubernetes.io=cntrl`
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node.kubernetes.io/class_id
                    operator: NotIn
                    values:
                      - cntrl
          # Soft preference: Prefer `node.kubernetes.io=app`
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node.kubernetes.io/class_id
                    operator: In
                    values:
                      - app
            # Lower priority preference for `node.kubernetes.io=gen`
            - weight: 10
              preference:
                matchExpressions:
                  - key: node.kubernetes.io/class_id
                    operator: In
                    values:
                      - gen
      imagePullSecrets:
        - name: regcred
      containers:
        - image: ${IMAGE_REPO}/311crimemap/api:0.0.1-SNAPSHOT
          name: spring-api
          imagePullPolicy: Always
          resources:
            requests:
              memory: "1Gi"        # Minimum memory requested
            limits:
              memory: "3Gi"        # Maximum memory allowed
          envFrom:
          - configMapRef:
              name: postgresql-configmap
          env:
          - name: POSTGRESQL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgresql-secrets
                key: POSTGRESQL_PASSWORD
          - name: SPRING_DATASOURCE_URL
            value: "$(POSTGRESQL_URL)?prepareThreshold=0"
          - name: ADMIN_API_KEY
            valueFrom:
              secretKeyRef:
                name: api-secrets
                key: ADMIN_API_KEY
          - name: VITE_MAPTILER_API_KEY
            valueFrom:
              secretKeyRef:
                name: api-secrets
                key: VITE_MAPTILER_API_KEY
          - name: GEOAPIFY_API_KEY
            valueFrom:
              secretKeyRef:
                name: api-secrets
                key: GEOAPIFY_API_KEY
          - name: FETCH_DATA_DIR
            value: "/data"
          - name: DATA_DIR_MIN_FREE
            value: "5000000000" #5gb
          - name: JAVA_OPTS
            value: "-Dloader.main=com.quirkshop.nuisancemaps.NuisancemapsApplication"
          - name: ASYNC_EXECUTOR_CORE_POOL_SIZE
            value: "4"
          - name: ASYNC_EXECUTOR_MAX_POOL_SIZE
            value: "4"
          - name: ASYNC_EXECUTOR_QUEUE_CAPACITY
            value: "8"
          - name: CORS_ORIGINS
            value: "*,http://localhost:5173,http://localhost:4173"
          - name: WORKER_QUERY_LIMIT
            value: "100000"
          - name: BATCH_SIZE
            value: "50000"
          - name: VITE_MAX_DATA_RECORDS
            value: "10000"
          ## probes
          # livenessProbe:
          #   httpGet:
          #     path: /actuator/health/liveness
          #     port: 8080
          # readinessProbe:
          #   httpGet:
          #     path: /actuator/health/readiness
          #     port: 8080
          # lifecycle:
          #   preStop:
          #     exec:
          #       command: ["sh", "-c", "sleep 10"]
