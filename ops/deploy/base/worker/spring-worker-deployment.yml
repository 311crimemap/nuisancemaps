apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: spring-worker
  name: spring-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-worker
  strategy: {}
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: spring-worker
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - image: 058264272856.dkr.ecr.us-east-2.amazonaws.com/311crimemap/api:0.0.1-SNAPSHOT
          name: spring-worker
          imagePullPolicy: Always
          envFrom:
          - configMapRef:
              name: postgresql-config
          env:
          - name: POSTGRESQL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgresql-secrets
                key: POSTGRESQL_PASSWORD
          - name: SPRING_DATASOURCE_URL
            valueFrom:
              configMapKeyRef:
                name: postgresql-config
                key: POSTGRESQL_URL
          - name: FETCH_DATA_DIR
            value: "/data"
          - name: DATA_DIR_MIN_FREE
            value: "5000000000" #5gb
          - name: JAVA_OPTS
            value: "-Dloader.main=com.quirkshop.nuisancemaps.WorkerApplication"
          - name: ASYNC_EXECUTOR_CORE_POOL_SIZE
            value: "4"
          - name: ASYNC_EXECUTOR_MAX_POOL_SIZE
            value: "4"
          - name: ASYNC_EXECUTOR_QUEUE_CAPACITY
            value: "8"
          - name: WORKER_QUERY_LIMIT
            value: "100000"
          - name: BATCH_SIZE
            value: "50000"
          - name: MAX_DATA_RECORDS
            value: "10000"
          volumeMounts:
            - name: data-volume
              mountPath: /data

      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: data-pvc

          # # probes
          # livenessProbe:
