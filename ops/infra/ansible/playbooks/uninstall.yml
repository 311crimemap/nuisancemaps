#
# ansible-playbook -i hcloud.yml playbooks/uninstall.yml
#
- name: uninstall
  hosts: "{{ groups['label_env_id_' ~ env_id] }}"
  vars_files:
    - ../vars.yml
  gather_facts: true
  tasks:
    #
    # drain & delete nodes prior
    #
    - name: uninstall agents
      register: out
      command: "/usr/local/bin/k3s-agent-uninstall.sh"
      when: "inventory_hostname in (groups['label_env_id_' ~ env_id] | intersect(groups.label_node_agent))"

    - name: debug k3s uninstall agent
      debug:
        msg: "{{ out.stderr_lines }}"
      when: "inventory_hostname in (groups['label_env_id_' ~ env_id] | intersect(groups.label_node_agent))"

    - name: uninstall server
      register: out
      command: "/usr/local/bin/k3s-uninstall.sh"
      when: "inventory_hostname in (groups['label_env_id_' ~ env_id] | intersect(groups.label_node_server))"

    - name: debug k3s uninstall server
      debug:
        msg: "{{ out.stderr_lines }}"
      when: "inventory_hostname in (groups['label_env_id_' ~ env_id] | intersect(groups.label_node_server))"
