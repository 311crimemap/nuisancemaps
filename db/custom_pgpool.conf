# Enable load balancing
load_balance_mode = off

# query splitting
statement_level_load_balance = on

# Number of backend nodes
backend_hostname0 = 'pg-0'
backend_port0 = 5432
backend_weight0 = 1
backend_flag0 = 'ALLOW_TO_FAILOVER'

log_statement = 'all'
log_min_messages = 'warning'
log_per_node_statement = off
log_connections = on
log_hostname = on
