[global]
log-level-console=warn
log-level-file=warn
start-fast=y

[311crimemap]
pg1-user=postgres
pg1-path=/bitnami/postgresql/data
pg1-database=nuisancemaps
log-path=/mnt/pgbackrest

# local backup volume mount (see docker-compose.yml)
# docker config: './db' host directory mounted container at '/mnt'
# commented out to disable
#repo1-path=/mnt/pgbackrest
#repo1-retention-full=1
#repo1-retention-diff=1
#repo1-retention-archive=1

# s3 bucket backup
repo2-type=s3
repo2-retention-full=1
repo2-retention-diff=1
repo2-retention-archive=1
