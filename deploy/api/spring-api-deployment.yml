apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: spring-api
  name: spring-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-api
  strategy: {}
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: spring-api
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - image: 058264272856.dkr.ecr.us-east-2.amazonaws.com/311crimemap/api:0.0.1-SNAPSHOT
          name: spring-api
          envFrom:
          - configMapRef:
              name: postgresql-config
          env:
          - name: POSTGRESQL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgresql-secrets
                key: POSTGRESQL_PASSWORD
          - name: SPRING_DATASOURCE_URL
            valueFrom:
              configMapKeyRef:
                name: postgresql-config
                key: POSTGRESQL_URL
          - name: JAVA_OPTS
            value: "-Dloader.main=com.quirkshop.nuisancemaps.NuisancemapsApplication"

          ## probes
          # livenessProbe:
          #   httpGet:
          #     path: /actuator/health/liveness
          #     port: 8080
          # readinessProbe:
          #   httpGet:
          #     path: /actuator/health/readiness
          #     port: 8080
