apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
spec:
  selector:
    matchLabels:
      app: postgresql
      app.kubernetes.io/name: postgresql
  serviceName: postgresql
  replicas: 1
  template:
    metadata:
      labels:
        app: postgresql
        app.kubernetes.io/name: postgresql
    spec:
      # https://docs.bitnami.com/tutorials/running-non-root-containers-on-openshift#volumes-in-kubernetes
      securityContext:
        runAsUser: 1001
        fsGroup: 1001
      containers:
      - name: postgresql
        image: bitnami/postgresql:16.1.0
        envFrom:
        - configMapRef:
            name: postgresql-config
        env:
        - name: POSTGRESQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: POSTGRESQL_PASSWORD
        ports:
          # can't use configMap here (this value is explicitly for config)
        - name: postgresql
          containerPort: 5432
        volumeMounts:
        - name: data
          mountPath: /bitnami/postgresql
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      # NB: creates a pvc
      storageClassName: hcloud-volumes
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi
