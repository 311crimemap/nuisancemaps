version: '3.4'
services:
  # these are currently setup as "dev" first.
  # Will need to build standalone executable containers.
  web:
    image: '058264272856.dkr.ecr.us-east-2.amazonaws.com/311crimemap/web'
    build: "./web"
    volumes:
      - ./web:/web
    command: bash -c "npm run dev"
    ports:
      - 5173:5173  # dev server
      - 4173:4173  # prod build preview
    env_file:
      - .env.dev

  classifier:
    image: "058264272856.dkr.ecr.us-east-2.amazonaws.com/311crimemap/classifier"
    build: "./classifier"
    volumes:
      - ./classifier:/classifier
      # - ./api/src/main/resources/data/classifier_categories.json:/classifier/classifier_categories.json
    env_file:
      - .env.dev

  traefik:
    image: "traefik:v2.11.8"
    container_name: "traefik"
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.dashboard.address=:8081"
      - "--entrypoints.apiEntryPoint.address=:8000"
      - "--entrypoints.traefik.address=:9999"  # internal

    ports:
      - 8081:8081  # dashboard port
      - 8080:8000  # map traefik to api (apiEntryPoint address port)
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    labels:
      # need to enable dashboard on custom port
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`localhost`)"  # Rule for accessing the dashboard
      - "traefik.http.routers.traefik-dashboard.entrypoints=dashboard"   # Use the "dashboard entry point
      - "traefik.http.routers.traefik-dashboard.service=api@internal"    # Service name for Traefik's internal API
      - "traefik.http.middlewares.api-compression.compress=true"         # Gzip middleware

  api:
    #NB: deploy image is configured in pom.xml, built via spring boot.
    image: eclipse-temurin:17-jdk-alpine
    volumes:
      - ./api:/api
      - $HOME/.m2:/root/.m2
      - data:/data  # env.FETCH_DATA_DIR downloads location (typically local instance store)
    working_dir: '/api'
    #command: ash -c "./mvnw spring-boot:run -Dstart-class=com.quirkshop.nuisancemaps.NuisancemapsApplication"
    # enable debugger via dap-mode / dap-breakpoint-toggle
    command: ash -c "./mvnw spring-boot:run -Dstart-class=com.quirkshop.nuisancemaps.NuisancemapsApplication -Dspring-boot.run.jvmArguments='-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005'"
    ports:
      - 5005:5005 # enable remote debug port
    env_file:
      - .env.dev
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/`)"               # Routes all traffic to this service
      - "traefik.http.routers.api.entrypoints=apiEntryPoint"          # rRequests only of entry point "apiEntryPoint"
      - "traefik.http.services.api.loadbalancer.server.port=8080"     # container port of the API service (tomcat)
      - "traefik.http.routers.api.middlewares=api-compression@docker"  # Attach compression middleware
    depends_on:
      db:
         condition: service_healthy

  worker:
    image: eclipse-temurin:17-jdk-alpine
    volumes:
      - ./api:/api
      - $HOME/.m2:/root/.m2
      - data:/data  # env.FETCH_DATA_DIR downloads location (typically local instance store)
    working_dir: '/api'
    command: ash -c "./mvnw spring-boot:run -Dstart-class=com.quirkshop.nuisancemaps.WorkerApplication"
    env_file:
      - .env.dev
    # deploy: # to test multiple workers
    #   replicas: 3
    depends_on:
      db:
         condition: service_healthy

  db:
    image: bitnami/pgpool:4
    env_file:
      - .env.dev
    labels:
      - traefik.enable=false
    ports:
      - 5432:5432
    volumes:
      - ./db/custom_pgpool.conf:/config/custom_pgpool.conf
    healthcheck:
      test: ["CMD", "/opt/bitnami/scripts/pgpool/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5

  pg-0:
    image: bitnami/postgresql-repmgr:16
    #image: 'bitnami/postgresql:16.1.0'
    logging:
      driver: none
    volumes:
      - nuisancemaps_db:/bitnami/postgresql
      - ./temp:/temp  # useful for temp file store, restore database
      # installed at "per database" level
      - ./db/01_enable_postgis.sql:/docker-entrypoint-initdb.d/01_enable_postgis.sql
      - ./db/custom_pgpool.conf:/config/custom_pgpool.conf

      # pgbackrest
      # separate backup directory mounted external to named volume (nuisancemaps_db)
      - ./db/pgbackrest_bkup:/mnt/pgbackrest
      - ./db/pgbackrest.conf:/etc/pgbackrest.conf
      - ./db/archive.conf:/opt/bitnami/postgresql/conf/conf.d/archive.conf
      - ./db/custom_postgresql.conf:/opt/bitnami/postgresql/conf/conf.d/custom_postgresql.conf
      # pgbackrest recovery override
      # - ./db/run.sh:/opt/bitnami/scripts/postgresql/run.sh

    #network_mode: "host"
    shm_size: 1gb
    labels:
      - traefik.enable=false
    ports:
      - 5432
    env_file:
      - .env.dev
volumes:
  nuisancemaps_db:
  data:
