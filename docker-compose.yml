version: '3.4'
services:
  # these are currently setup as "dev" first.
  # Will need to build standalone executable containers.
  web:
    image: '058264272856.dkr.ecr.us-east-2.amazonaws.com/311crimemap/web'
    build: "./web"
    volumes:
      - ./web:/web
    command: bash -c "npm run dev"
    ports:
      - 5173:5173  # dev server
      - 4173:4173  # prod build preview
    env_file:
      - .env.dev

  # classifier:
  #   image: "058264272856.dkr.ecr.us-east-2.amazonaws.com/311crimemap/classifier"
  #   build: "./classifier"
  #   volumes:
  #     - ./classifier:/classifier
  #     # - ./api/src/main/resources/data/classifier_categories.json:/classifier/classifier_categories.json
  #   env_file:
  #     - .env.dev

  api:
    #NB: deploy image is configured in pom.xml, built via spring boot.
    image: eclipse-temurin:17-jdk-alpine
    volumes:
      - ./api:/api
      - $HOME/.m2:/root/.m2
    working_dir: '/api'
    #command: ash -c "./mvnw spring-boot:run -Dstart-class=com.quirkshop.nuisancemaps.NuisancemapsApplication"
    # enable debugger via dap-mode / dap-breakpoint-toggle
    command: ash -c "./mvnw spring-boot:run -Dstart-class=com.quirkshop.nuisancemaps.NuisancemapsApplication -Dspring-boot.run.jvmArguments='-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005'"
    ports:
      - 8080:8080
      - 5005:5005 # enable remote debug port
    env_file:
      - .env.dev

  worker:
    image: eclipse-temurin:17-jdk-alpine
    volumes:
      - ./api:/api
      - $HOME/.m2:/root/.m2
    working_dir: '/api'
    command: ash -c "./mvnw spring-boot:run -Dstart-class=com.quirkshop.nuisancemaps.WorkerApplication"
    env_file:
      - .env.dev
    # deploy: # to test multiple workers
    #   replicas: 3

  db:
    image: 'bitnami/postgresql:16.1.0'
    volumes:
      - nuisancemaps_db:/bitnami/postgresql
      # installed at "per database" level
      - ./db/01_enable_postgis.sql:/docker-entrypoint-initdb.d/01_enable_postgis.sql

      # pgbackrest
      # separate backup directory mounted external to named volume (nuisancemaps_db)
      - ./db/pgbackrest:/mnt/pgbackrest
      - ./db/pgbackrest.conf:/etc/pgbackrest.conf
      - ./db/archive.conf:/opt/bitnami/postgresql/conf/conf.d/archive.conf
      # pgbackrest recovery override
      # - ./db/run.sh:/opt/bitnami/scripts/postgresql/run.sh

    #network_mode: "host"
    shm_size: 1gb
    ports:
      - 5432:5432
    env_file:
      - .env.dev

volumes:
  nuisancemaps_db:
